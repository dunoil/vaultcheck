[package]
name = "agent-vault-starter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Starter T3N tenant contract: a private customer vault that agents can only ask yes/no questions of"

# cdylib makes the wasm32-wasip2 target emit a WASM component; lib keeps the
# logic unit-testable natively with `cargo test`.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
